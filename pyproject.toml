[project]
name = "wildcat-code-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "geocarlos", email = "geowildcat@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "ollama>=0.6.3",
    "platformdirs>=4.14.8",
    "pywebview>=6.2.1",
    "tomlkit>=0.15.3",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
wildcat-code-agent = "wildcat_code_agent:main"
wca = "wildcat_code_agent:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.65.2",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pyyaml>=6.0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
