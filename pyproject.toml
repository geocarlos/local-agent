[project]
name = "local-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "geocarlos", email = "geowildcat@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "ollama>=0.6.3",
    "platformdirs>=4.14.8",
]

[project.scripts]
local-agent = "local_agent:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
