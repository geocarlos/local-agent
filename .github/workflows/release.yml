name: Release

# Builds local-agent.exe and the installer on Windows. Read README.md ("Releasing") before changing it.
#
# - Tag push `vX.Y.Z` (or `vX.Y.Z-suffix`): builds, tests and packages, then creates a GitHub Release with
#   the installer, a zip of the app folder and SHA256SUMS.txt. The tag must equal `v` + the version in pyproject.toml.
# - Pull request touching the release inputs, and manual `workflow_dispatch`: a dry run. It builds, tests and
#   uploads the same files as workflow artifacts. It never creates a release.

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

# Read-only by default. Only the publish job below asks for write access.
permissions:
  contents: read

# Two runs for the same ref (e.g. a re-pushed tag) queue instead of racing to publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Use only uv-managed Pythons (python-build-standalone), never a conda or system Python. This is the
  # Python that the frozen build bundles, so the build does not depend on the runner's Python.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install Python 3.14 (uv-managed) and dependencies
        shell: pwsh
        run: |
          uv python install 3.14
          if ($LASTEXITCODE -ne 0) { throw "uv python install 3.14 failed" }
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { throw "uv sync --locked failed" }
          uv run python -c "import sys; print(sys.version); print('base_prefix:', sys.base_prefix); assert sys.version_info[:2] == (3, 14), sys.version"
          if ($LASTEXITCODE -ne 0) { throw "The project environment is not Python 3.14" }

      - name: Read the version and check the tag
        id: version
        shell: pwsh
        run: |
          # GITHUB_REF_NAME and GITHUB_REF_TYPE are set by Actions; they are not from user input.
          $Pyproject = Get-Content pyproject.toml -Raw
          if ($Pyproject -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "No version line in pyproject.toml" }
          $Version = $Matches[1]
          Write-Host "pyproject.toml version: $Version"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
              $Tag = $env:GITHUB_REF_NAME
              if ($Tag -ne "v$Version") {
                  Write-Host "::error title=Tag does not match pyproject.toml::Tag '$Tag' must be 'v$Version' (the version in pyproject.toml). Bump the version, commit, and tag again."
                  exit 1
              }
              Write-Host "Tag $Tag matches the version."
          } else {
              Write-Host "Not a tag build (dry run): the tag check is skipped."
          }
          "version=$Version" >> $env:GITHUB_OUTPUT

      - name: Run the test suite
        shell: pwsh
        run: |
          uv run --locked pytest -q
          if ($LASTEXITCODE -ne 0) { throw "pytest failed" }

      - name: Build local-agent.exe
        shell: pwsh
        run: |
          .\packaging\build.ps1

      - name: Run the frozen-exe tests
        shell: pwsh
        run: |
          $env:LOCAL_AGENT_EXE = Join-Path $env:GITHUB_WORKSPACE "dist\local-agent\local-agent.exe"
          uv run --locked pytest -q -rs tests/test_frozen_exe.py
          if ($LASTEXITCODE -ne 0) { throw "frozen-exe tests failed" }

      - name: Smoke-test the exe's standard-library modules
        shell: pwsh
        run: |
          .\packaging\smoke-exe.ps1

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          # The runner image may already have it. build-installer.ps1 looks in Program Files (x86) and
          # Program Files, and on PATH. Chocolatey installs it to Program Files (x86).
          $Found = @(
              (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
              (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          ) | Where-Object { Test-Path $_ }
          if ($Found) {
              Write-Host "Inno Setup is already installed: $(@($Found)[0])"
          } else {
              choco install innosetup --version=6.7.1 -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          }

      - name: Build the installer
        shell: pwsh
        run: |
          # Reuses dist\local-agent from the step above. The version comes from pyproject.toml.
          .\packaging\build-installer.ps1

      - name: Package the release files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $Version = $env:VERSION
          $Out = Join-Path $env:GITHUB_WORKSPACE "dist\release"
          Remove-Item $Out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $Out | Out-Null

          # The zip holds one folder, local-agent-<version>-win-x64\, with the exe and _internal\ in it.
          $Stage = Join-Path $env:RUNNER_TEMP "stage\local-agent-$Version-win-x64"
          New-Item -ItemType Directory -Path (Split-Path $Stage) -Force | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "dist\local-agent") $Stage -Recurse
          $Zip = Join-Path $Out "local-agent-$Version-win-x64.zip"
          Compress-Archive -Path $Stage -DestinationPath $Zip

          $Setup = Join-Path $Out "local-agent-$Version-setup.exe"
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "dist\installer\local-agent-$Version-setup.exe") $Setup
          if (-not (Test-Path $Zip) -or -not (Test-Path $Setup)) { throw "Expected the zip and the setup exe" }

          # SHA256SUMS.txt in the format `sha256sum -c` reads: "<hex>  <file name>", lower-case hex.
          $Lines = foreach ($File in @($Setup, $Zip)) {
              "{0}  {1}" -f (Get-FileHash $File -Algorithm SHA256).Hash.ToLower(), (Split-Path $File -Leaf)
          }
          $Sums = Join-Path $Out "SHA256SUMS.txt"
          [System.IO.File]::WriteAllText($Sums, (($Lines -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))

          Get-ChildItem $Out | ForEach-Object { Write-Host ("{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)) }
          Get-Content $Sums

      - name: Upload the release files as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-agent-release-${{ steps.version.outputs.version }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    # Only a real tag push publishes. A manual run on a tag ref (workflow_dispatch) does not.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: local-agent-release-${{ needs.build.outputs.version }}
          path: release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # A tag with a suffix (for example v0.2.0-rc1) is a pre-release.
          flags=()
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "local-agent $VERSION" \
            --generate-notes \
            "${flags[@]}"
