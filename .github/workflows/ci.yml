name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      # The real-window test is not a hard gate yet (T18 review): it runs in its own step below.
      - name: Run tests
        run: uv run --locked pytest --ignore=tests/test_gui_window.py

      # Non-blocking: learns whether the pywebview window works on windows-latest. It skips when no
      # desktop or WebView2 runtime is there; WILDCAT_CODE_AGENT_REQUIRE_WINDOW=1 makes a missing backend a failure.
      - name: Real window test (non-blocking)
        continue-on-error: true
        env:
          WILDCAT_CODE_AGENT_REQUIRE_WINDOW: "1"
        run: uv run --locked pytest tests/test_gui_window.py -v

  # The VS Code extension (T19): TypeScript compile and the node tests. The tests do not start VS Code.
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm test
