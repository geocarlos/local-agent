<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wildcat Code Agent</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <h1>Wildcat Code Agent</h1>
    <span id="status" class="status" role="status">Connecting...</span>
    <span id="workspace" class="workspace" title="The folder the agent works in"></span>
    <div class="bar-controls">
      <label class="model-pick">
        <span class="visually-hidden">Model</span>
        <select id="model" class="lockable" disabled title="The model this chat uses"></select>
      </label>
      <button id="sessions-toggle" class="lockable" type="button" aria-controls="drawer" aria-expanded="false">Sessions</button>
      <button id="settings-open" type="button" disabled>Settings</button>
    </div>
  </header>

  <div class="shell">
  <aside id="drawer" class="drawer" aria-label="Sessions" hidden>
    <div class="drawer-head">
      <h2>Sessions</h2>
      <button id="new-chat" class="lockable" type="button" disabled>New chat</button>
    </div>
    <p id="sessions-empty" class="muted" hidden>No saved chats yet. A chat is saved after its first message.</p>
    <ul id="session-list" class="session-list" aria-label="Saved chats"></ul>
    <button id="sessions-more" class="lockable" type="button" hidden>Load more</button>
  </aside>

  <main class="layout">
    <section id="chat" class="chat" aria-label="Conversation"></section>
    <p id="notice" class="notice" hidden></p>

    <form id="composer" class="composer" autocomplete="off">
      <label for="prompt" class="visually-hidden">Message</label>
      <textarea id="prompt" rows="3" placeholder="Ask wildcat-code-agent. Enter sends, Shift+Enter adds a line." disabled></textarea>
      <div class="actions">
        <span id="usage" class="usage" aria-live="polite"></span>
        <button id="cancel" type="button" disabled>Cancel</button>
        <button id="send" type="submit" disabled>Send</button>
      </div>
    </form>
  </main>
  </div>

  <dialog id="approval" class="approval" aria-labelledby="approval-title">
    <h2 id="approval-title"></h2>
    <div id="approval-preview" class="preview"></div>
    <div id="approval-options" class="options"></div>
  </dialog>

  <dialog id="settings" class="settings" aria-labelledby="settings-title">
    <h2 id="settings-title">Settings</h2>
    <p id="settings-file" class="muted"></p>
    <form id="settings-form" class="settings-form">
      <label>Default model
        <input id="set-model" name="model" type="text" autocomplete="off" spellcheck="false">
      </label>
      <label>Ollama address
        <input id="set-host" name="host" type="text" autocomplete="off" spellcheck="false">
      </label>
      <label>Context size (num_ctx)
        <input id="set-num_ctx" name="num_ctx" type="number" min="512" step="1">
      </label>
      <label>Tool rounds per reply (max_tool_rounds)
        <input id="set-max_tool_rounds" name="max_tool_rounds" type="number" min="1" step="1">
      </label>
      <label>Tool output limit, characters (max_output_chars)
        <input id="set-max_output_chars" name="max_output_chars" type="number" min="1" step="1">
      </label>
      <label>Command time limit, seconds (command_timeout_s)
        <input id="set-command_timeout_s" name="command_timeout_s" type="number" min="1" step="1">
      </label>
      <label>Network time limit, seconds (network_timeout_s)
        <input id="set-network_timeout_s" name="network_timeout_s" type="number" min="1" step="1">
      </label>
      <label>Tool profile (tool_profile)
        <select id="set-tool_profile" name="tool_profile">
          <option value="minimal">minimal</option>
          <option value="coding">coding</option>
          <option value="all">all</option>
        </select>
      </label>
      <p class="muted">Saved settings take effect when wildcat-code-agent starts again. The model picker in the chat changes only the current chat.</p>
      <p id="settings-message" class="notice" role="status" hidden></p>
      <div class="options">
        <button id="settings-close" type="button">Close</button>
        <button id="settings-save" class="primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
